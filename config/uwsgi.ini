[uwsgi]
projectname = educa
base = /mnt/c/Blog_application/educa

master = true
virtualenv = %(base)/env_educa_linux
pythonpath = %(base)
chdir = %(base)
env = DJANGO_SETTINGS_MODULE=%(projectname).settings.pro
module = %(projectname).wsgi:application
socket = /tmp/%(projectname).sock
chmod-socket = 666